name: SAB Eldorado Daily Market Collection

# Priority-queue Eldorado collection: fills mutation prices on the highest-value
# brainrots first (OGs/Secrets, biggest coverage gaps), with deep pagination so
# every mutation gets enough samples. API-based — no browser needed, unlike the
# Itemku workflow.
#
# Rotation is DATABASE-driven (--refresh-after-hours), not progress-file driven.
# The progress file is committed to the repo and this workflow never commits it
# back, so a scheduled run always checked out the same frozen state (200
# attempts, all 2026-07-26), skipped those, and re-crawled the same next-120
# every single day. Coverage could not grow past ~320 of 498 and nothing was
# ever revisited — which is why listing disappearance carried no signal and
# ended_at was null on every row.
#
# Re-crawling the same panel daily is also what /api/cron/expire-sab-listings
# depends on: absence only means something if we actually looked again.

on:
  workflow_dispatch:
    inputs:
      max_brainrots:
        description: How many brainrots to collect this run
        required: false
        default: "210"
      max_pages:
        description: Offer pages to fetch per brainrot (deeper = more mutations)
        required: false
        default: "10"
      reset_progress:
        description: Restart the queue from the top (true/false)
        required: false
        default: "false"
      refresh_after_hours:
        description: Re-crawl anything not priced within this many hours (0 = backfill only)
        required: false
        default: "6"
  schedule:
    # Every 3h over the CURATED tradeable set (~300 items, not all 498). The
    # collector's staleness queue (--refresh-after-hours 6) makes each 3h run
    # grab whichever tradeable items aged past 6h → about half the set per run,
    # whole curated set every ~6h. No item's listings go older than ~6h, and we
    # spend zero budget on junk nobody trades. Self-balancing (a new item is max-
    # stale → crawled next run) and self-healing (a failed run just leaves items
    # for the next tick — no static half to black out).
    - cron: "0 */3 * * *"

concurrency:
  group: sab-eldorado-daily-market
  cancel-in-progress: false

jobs:
  collect-and-import:
    runs-on: ubuntu-latest
    # GitHub Actions allows up to 6h; a full priority sweep is ~30-40 min.
    timeout-minutes: 120

    permissions:
      contents: read

    env:
      SAB_MARKET_IMPORT_SECRET: ${{ secrets.SAB_MARKET_IMPORT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # The popularity step writes popularity_rank directly to sab_brainrots.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Let the collector reprice as its LAST step (correct-prices?game=sab) once
      # the whole crawl has landed — closes the snapshot-lag race that let a
      # stale cheapest publish. The 10:00 UTC Vercel cron stays as a backstop.
      PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect and import Eldorado market data (priority queue)
        run: >-
          npm run sab:eldorado:send --
          --max-brainrots ${{ inputs.max_brainrots || '210' }}
          --max-pages ${{ inputs.max_pages || '10' }}
          --samples-per-variant 25
          --delay-ms 1500
          --refresh-after-hours ${{ inputs.refresh_after_hours || '6' }}
          ${{ (inputs.reset_progress == 'true') && '--reset-progress' || '' }}

      # Refresh the "Popular" tab ordering from Eldorado's real popularity feed
      # (usePopularItems). Runs after the market collect so the freshest catalog
      # is in place. Non-fatal: a failure here must not fail the price import.
      - name: Refresh Popular ranking
        continue-on-error: true
        run: npm run sab:eldorado:popularity

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eldorado-sab-market-${{ github.run_id }}
          path: data/sab-market-feeds/eldorado-api-latest.json
          if-no-files-found: warn
          retention-days: 14
