# Hourly SEO pipeline (growth point 28). Lives here because vercel.json crons
# are once-daily in this repo; the vercel.json entries for /api/cron/seo-indexnow
# (05:40) and /api/cron/seo-gsc (06:20) are the backstop, this is the real cadence.
#  - seo-indexnow: retries unsent/failed IndexNow rows within the hour, and runs
#    the post-deploy step within an hour of a release.
#  - seo-gsc: one ~4-minute URL Inspection batch every 3rd hour (8 a day, ~150
#    pages each, cover the ~1,000-page sitemap daily). The route caps the day
#    at 1,500 inspections (Google allows 2,000) and pulls Search Analytics once
#    a day.
# Both handlers are idempotent; an overlapping run does nothing twice.
name: SEO Hourly
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch: {}
concurrency:
  group: seo-hourly
  cancel-in-progress: false
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deliver the SEO change log to IndexNow
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -m 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dropmarket.gg/api/cron/seo-indexnow)
          cat /tmp/out
          [ "$code" = "200" ] || exit 1
      # Every 3rd UTC hour only (2026-10-20 usage audit): each call loads the
      # whole sitemap input + every stored inspection from Supabase, and 8
      # batches of ~150 already cover the ~1,000-page sitemap. A manual run
      # always inspects.
      - name: Google URL Inspection batch
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            h=$(date -u +%H)
            if [ $((10#$h % 3)) -ne 0 ]; then
              echo "Inspection batch runs every 3rd UTC hour; skipped at ${h}:xx."
              exit 0
            fi
          fi
          code=$(curl -s -o /tmp/out -w "%{http_code}" -m 310 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dropmarket.gg/api/cron/seo-gsc)
          cat /tmp/out
          [ "$code" = "200" ] || exit 1
