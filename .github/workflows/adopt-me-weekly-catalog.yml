name: Adopt Me Weekly Catalog

# Re-scrapes the Adopt Me pet catalog (adoptmevalues.app) and upserts it by
# slug, so pets/eggs added in Adopt Me's Friday updates are picked up
# automatically without duplicating existing pets. Also refreshes the community
# trade values. Cash prices come from the separate daily workflow.

on:
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC every Saturday — after Friday's Adopt Me update has landed.
    - cron: "0 6 * * 6"

concurrency:
  group: adopt-me-weekly-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect + upsert catalog (new pets auto-added by slug)
        run: npm run adoptme:catalog

      - name: Upload catalog feed (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-me-catalog-${{ github.run_id }}
          path: data/adopt-me-feeds/adoptmevalues-latest.json
          if-no-files-found: warn
          retention-days: 14
