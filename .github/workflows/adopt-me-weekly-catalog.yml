name: Adopt Me Weekly Catalog

# Re-scrapes the Adopt Me pet catalog (adoptmevalues.app) and upserts it by
# slug, so pets/eggs added in Adopt Me's Friday updates are picked up
# automatically without duplicating existing pets. Also refreshes the community
# trade values. Cash prices come from the separate daily workflow.

on:
  workflow_dispatch: {}
  schedule:
    # 14:20 UTC every Saturday — after Friday's Adopt Me update has landed.
    # Was 06:00, inside the daily values-pricing window (02:10 + up to 5 h,
    # Adopt Me's own reprice included). Shares its clock slot with the Sunday
    # backup on a different day (src/test/routes/db-heavy-schedule.test.ts).
    - cron: "20 14 * * 6"

concurrency:
  group: adopt-me-weekly-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect + upsert catalog (new pets auto-added by slug)
        run: pnpm adoptme:catalog

      - name: Upload catalog feed (debug artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: adopt-me-catalog-${{ github.run_id }}
          path: data/adopt-me-feeds/adoptmevalues-latest.json
          if-no-files-found: warn
          retention-days: 14
