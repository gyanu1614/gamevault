name: Adopt Me Weekly Catalog

# Re-scrapes the Adopt Me pet catalog (adoptmevalues.app) and upserts it by
# slug, without duplicating existing pets, and refreshes the community trade
# values. NEW pets (Friday updates) are added only when the dry run says they
# qualify — a variant with a real reputable price above $1 (owner rule, T2).
# Before 2026-10-14 the import held back every new slug (no --qualifying), so
# no new pet was ever added. Cash prices come from the separate daily workflow.

on:
  workflow_dispatch: {}
  schedule:
    # 14:20 UTC every Saturday — after Friday's Adopt Me update has landed.
    # Was 06:00, inside the daily values-pricing window (02:10 + up to 5 h,
    # Adopt Me's own reprice included). Shares its clock slot with the Sunday
    # backup on a different day (src/test/routes/db-heavy-schedule.test.ts).
    - cron: "20 14 * * 6"

concurrency:
  group: adopt-me-weekly-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      # The dry run reads the live catalog with the public key (GET only).
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Which new pets qualify (dry run, local files only)
        run: pnpm adoptme:catalog:dryrun

      - name: Collect + upsert catalog (new pets only when they qualify)
        run: |
          REPORT=$(ls -t data/adopt-me-catalog-dryrun/*.json | grep -v eldorado-crawl | head -1)
          echo "qualifying report: $REPORT"
          pnpm adoptme:catalog --qualifying "$REPORT"

      - name: Upload catalog feed (debug artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: adopt-me-catalog-${{ github.run_id }}
          path: |
            data/adopt-me-feeds/adoptmevalues-latest.json
            data/adopt-me-catalog-dryrun/*.csv
          if-no-files-found: warn
          retention-days: 14
