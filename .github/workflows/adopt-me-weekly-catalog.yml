name: Values Weekly Catalog

# Adopt Me pictures only (2026-10-22). New pets for every hub game, Adopt Me
# included, come from the daily catalogue job (values-catalogue-daily.yml,
# src/lib/catalogue/) reading each game's Fandom wiki. adoptmevalues.app is no
# longer scraped: its terms forbid it, and its import rewrote existing pets
# (name, rarity, demand_trend, is_active) every week.
#
# What stays here: the weekly check that copies the Adopt Me Wiki's picture for
# any pet whose stored image no longer loads (older rows point at the old CDN).

on:
  workflow_dispatch: {}
  schedule:
    # 14:20 UTC every Saturday — after Friday's Adopt Me update has landed.
    # Was 06:00, inside the daily values-pricing window (02:10 + up to 5 h,
    # Adopt Me's own reprice included). Shares its clock slot with the Sunday
    # backup on a different day (src/test/routes/db-heavy-schedule.test.ts).
    - cron: "20 14 * * 6"

concurrency:
  group: adopt-me-weekly-catalog
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    # ~15 min: one image check per active pet, 1 s apart.
    timeout-minutes: 30

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Copy the Adopt Me Wiki's picture into our bucket for any pet whose image
      # does not load. Pets whose image loads, and earlier copies, are never touched.
      - name: Copy wiki images for pets whose image is broken
        run: pnpm adoptme:images --write
