name: SAB G2G Daily Market Collection

# Second price source (alongside Eldorado). G2G exposes a public no-auth
# JSON API, so this needs no browser — it iterates the SAB Brainrot taxonomy and
# calls sls.g2g.com/v3/offer/search per Brainrot. Its value is DEPTH: a single
# variant returns dozens of independent sellers, which is what lets the blend's
# median discard outliers instead of averaging two sources into their midpoint.
#
# Runs at 05:20 UTC. Eldorado is 3-hourly (`0 */3 * * *`) and the price snapshot
# is `15 10 * * *`, so this is NOT sequenced between them — an earlier comment
# here claimed "after Eldorado (05:00) and before the price snapshot (06:00)",
# which was never true of these schedules. Blending does not depend on ordering:
# the importer upserts and the publish step re-reads whatever evidence exists.
#
# DB-driven panel refresh (--refresh-after-hours). ROUTE-016: this genuinely is
# DB-driven now. It previously read the COMMITTED progress file's `attempted_at`,
# and since this workflow never commits that file back, every run started from
# the same frozen snapshot and took the same rarity-ordered head — 265 of 385
# Brainrots were unreachable. Eligibility and ordering now come from the newest
# matched G2G raw listing per Brainrot (SUPABASE_SERVICE_ROLE_KEY below is
# required for that; without it every item reads as never-crawled).

on:
  workflow_dispatch:
    inputs:
      max_brainrots:
        description: How many Brainrots to collect this run
        required: false
        default: "120"
      max_pages:
        description: Offer pages per Brainrot (48 offers/page)
        required: false
        default: "3"
      reset_progress:
        description: Restart the queue from the top (true/false)
        required: false
        default: "false"
      refresh_after_hours:
        description: Re-crawl anything not attempted within this many hours (0 = backfill only)
        required: false
        default: "20"
  schedule:
    - cron: "20 5 * * *"

concurrency:
  group: sab-g2g-daily-market
  cancel-in-progress: false

jobs:
  collect-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      SAB_MARKET_IMPORT_SECRET: ${{ secrets.SAB_MARKET_IMPORT_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # ROUTE-016: the per-item crawl-freshness lookup reads
      # sab_market_raw_listings, which anon is denied. Without this the collector
      # degrades to rarity order and the queue stops rotating.
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect and import G2G market data
        run: >-
          pnpm sab:g2g:send
          --max-brainrots ${{ inputs.max_brainrots || '120' }}
          --max-pages ${{ inputs.max_pages || '3' }}
          --delay-ms 1500
          --refresh-after-hours ${{ inputs.refresh_after_hours || '20' }}
          ${{ (inputs.reset_progress == 'true') && '--reset-progress' || '' }}

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: g2g-sab-market-${{ github.run_id }}
          path: data/sab-market-feeds/g2g-api-latest.json
          if-no-files-found: warn
          retention-days: 14
