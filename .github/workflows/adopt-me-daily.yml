name: Adopt Me Daily Prices

# Refreshes Adopt Me cash values from the marketplaces (Eldorado + u7buy) and
# captures the daily price-history snapshot. Runs in CI because the collectors
# scrape live external sites — they need a real network and can't run inside a
# Vercel serverless cron. Both collectors use plain fetch (the u7buy endpoint
# was reverse-engineered), so NO browser install is needed here.
#
# The weekly catalog refresh (new pets/eggs on Adopt Me's Friday updates) is a
# separate workflow: adopt-me-weekly-catalog.yml.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Offer pages to fetch per pet (deeper = more samples)
        required: false
        default: "10"
  schedule:
    # 05:30 UTC daily — after the SAB collection (05:00) settles.
    - cron: "30 5 * * *"

concurrency:
  group: adopt-me-daily-prices
  cancel-in-progress: false

jobs:
  refresh-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Trigger the unified pricing cron once raw listings are imported.
      PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Tuning (optional overrides for the fake-listing filters).
      # Eldorado's offers API is relevance-ranked, not price-sorted, so the
      # cheapest reputable listing can sit several pages deep (same reason SAB
      # pages to 25). Now that te_v2 scopes results to the exact pet, the busiest
      # pet (Owl) is ~13 pages — 10 truncated it and showed $72 instead of $60.58.
      # 20 covers every pet; the collector stops early on the last page.
      ELDORADO_AM_MAX_PAGES: ${{ inputs.max_pages || '20' }}
      U7_AM_MAX_PAGES: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect Eldorado cash listings (fake-filtered)
        run: pnpm adoptme:cash:eldorado

      - name: Collect u7buy cash listings (seller-trust filtered)
        run: pnpm adoptme:cash:u7buy

      - name: Import raw listings to Supabase
        run: pnpm adoptme:cash:import

      # Prices are recomputed HERE on the runner, not through
      # /api/cron/correct-prices — the same move SAB (PR #76) and Steal An Egg
      # made. This step used to curl that route with continue-on-error, with
      # the daily 10:00 UTC vercel.json cron as its backstop. The cron entry is
      # gone (2026-09-20: it ran the SAB reprice a second time on a 300s budget
      # it could not meet), so a swallowed curl here would have been Adopt Me's
      # ONLY repricing — the exact shape that froze SAB prices for five days.
      #
      # Deliberately NOT continue-on-error: a failed reprice must fail the job.
      - name: Reprice Adopt Me
        run: pnpm reprice --game=adopt-me

      # The route used to revalidate the price cache tag after pricing; on the
      # runner the value pages are revalidated by path, as Steal An Egg does.
      - name: Revalidate the value pages
        env:
          VALUES_REVALIDATE_SECRET: ${{ secrets.VALUES_REVALIDATE_SECRET }}
        run: |
          curl -sS -f -X POST \
            -H "x-values-revalidate-secret: ${VALUES_REVALIDATE_SECRET}" \
            "${PUBLIC_API_URL}/api/internal/values-revalidate?game=adopt-me" \
            || { echo "revalidate failed"; exit 1; }

      - name: Upload feeds (debug artifact)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: adopt-me-cash-feeds-${{ github.run_id }}
          path: data/adopt-me-feeds/*-cash-latest.json
          if-no-files-found: warn
          retention-days: 14
