name: Adopt Me Daily Prices

# Refreshes Adopt Me cash values from the marketplaces (Eldorado + u7buy) and
# captures the daily price-history snapshot. Runs in CI because the collectors
# scrape live external sites — they need a real network and can't run inside a
# Vercel serverless cron. Both collectors use plain fetch (the u7buy endpoint
# was reverse-engineered), so NO browser install is needed here.
#
# The weekly catalog refresh (new pets/eggs on Adopt Me's Friday updates) is a
# separate workflow: adopt-me-weekly-catalog.yml.

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Offer pages to fetch per pet (deeper = more samples)
        required: false
        default: "4"
  schedule:
    # 05:30 UTC daily — after the SAB collection (05:00) settles.
    - cron: "30 5 * * *"

concurrency:
  group: adopt-me-daily-prices
  cancel-in-progress: false

jobs:
  refresh-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Trigger the unified pricing cron once raw listings are imported.
      PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Tuning (optional overrides for the fake-listing filters).
      ELDORADO_AM_MAX_PAGES: ${{ inputs.max_pages || '4' }}
      U7_AM_MAX_PAGES: "3"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Eldorado cash listings (fake-filtered)
        run: npm run adoptme:cash:eldorado

      - name: Collect u7buy cash listings (seller-trust filtered)
        run: npm run adoptme:cash:u7buy

      - name: Import raw listings to Supabase
        run: npm run adoptme:cash:import

      # Pricing + history reconciliation now happen in the unified correct-prices
      # cron (reputable engine, shared with SAB), not here. Trigger it for just
      # Adopt Me so the fresh raw listings are priced immediately after import,
      # rather than waiting for the 10:00 UTC Vercel schedule. Best-effort: a
      # failure here doesn't fail the collection (the scheduled cron will catch
      # up), so the raw import still counts as a successful run.
      - name: Price Adopt Me (unified reputable cron)
        continue-on-error: true
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$PUBLIC_API_URL/api/cron/correct-prices?game=adopt-me"

      - name: Upload feeds (debug artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adopt-me-cash-feeds-${{ github.run_id }}
          path: data/adopt-me-feeds/*-cash-latest.json
          if-no-files-found: warn
          retention-days: 14
