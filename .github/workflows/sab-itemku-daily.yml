name: SAB Itemku Daily Market Collection

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum Itemku category pages
        required: false
        default: "60"
  schedule:
    - cron: "23 9 * * *"

concurrency:
  group: sab-itemku-daily-market
  cancel-in-progress: false

jobs:
  collect-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      SAB_MARKET_IMPORT_SECRET: ${{ secrets.SAB_MARKET_IMPORT_SECRET }}
      ITEMKU_MAX_PAGES: ${{ inputs.max_pages || '60' }}
      ITEMKU_DELAY_MS: "2500"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect and import Itemku market data
        run: npm run sab:itemku:send

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itemku-sab-market-${{ github.run_id }}
          path: data/sab-market-feeds/itemku-latest.json
          if-no-files-found: warn
          retention-days: 14
