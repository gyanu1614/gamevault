name: SAB Itemku Daily Market Collection

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: Maximum Itemku category pages
        required: false
        default: "60"
  schedule:
    - cron: "23 9 * * *"

concurrency:
  group: sab-itemku-daily-market
  cancel-in-progress: false

jobs:
  collect-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read

    env:
      SAB_MARKET_IMPORT_SECRET: ${{ secrets.SAB_MARKET_IMPORT_SECRET }}
      ITEMKU_MAX_PAGES: ${{ inputs.max_pages || '60' }}
      ITEMKU_DELAY_MS: "2500"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Collect and import Itemku market data
        # Itemku is Playwright/browser-based, so it's inherently flakier than the
        # API collectors — a transient bot-check or browser-launch failure should
        # not fail the whole daily run. Retry up to 3 times with backoff; only a
        # genuine, repeated failure aborts the job. Itemku is a secondary source
        # (Eldorado + G2G are the primary blend), so a rare fully-failed day is
        # low impact anyway.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Itemku collect attempt ${attempt}/3"
            if npm run sab:itemku:send; then
              echo "::endgroup::"
              echo "Itemku collection succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::Itemku attempt ${attempt} failed"
            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Itemku collection failed after 3 attempts"
          exit 1

      - name: Upload collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: itemku-sab-market-${{ github.run_id }}
          path: data/sab-market-feeds/itemku-latest.json
          if-no-files-found: warn
          retention-days: 14
