name: Database Backup

# Weekly encrypted logical backup of the production Supabase database.
#
# WEEKLY since 2026-10-09 (owner-approved): the daily data dump was 413 MB and
# growing ~8 MB/day — most of the free plan's 5 GB egress (6.3 GB used) — and
# it ran on top of the pricing/retention jobs that pushed the Nano instance
# into swap. The data pass also skips the bulk tables a re-crawl rebuilds
# (see `exclude=` below); their DDL is still in the schema pass, so a restore
# recreates them empty and the next pricing run refills them.
#
# The dump is never written anywhere unencrypted beyond the runner's ephemeral
# disk: it is gzipped and then encrypted to an age PUBLIC key held in repo
# secrets, so this workflow (and anyone with repo access) can CREATE a backup
# but cannot READ one. Decryption needs the private key, which lives only with
# the owner. Restore instructions: scripts/restore-backup.md
#
# Every step is fail-loud: `set -euo pipefail`, no `continue-on-error`, and the
# artifact upload errors if the encrypted file is missing.

on:
  workflow_dispatch:
  schedule:
    # 14:20 UTC Sundays. GitHub starts this repo's schedules 5–7 h late, by
    # about the same amount for every workflow on a day, so cron spacing is
    # real spacing: this sits ≥3 h clear of values pricing (02:10), SAB
    # retention (10:40) and trend radar (18:47 / 22:41) — pinned by
    # src/test/routes/db-heavy-schedule.test.ts. The Saturday catalogue
    # refresh shares the clock slot on a different day.
    - cron: "20 14 * * 0"

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify required secrets are present
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Repository secret SUPABASE_DB_URL is not set."
            missing=1
          fi
          if [ -z "${BACKUP_AGE_PUBLIC_KEY:-}" ]; then
            echo "::error::Repository secret BACKUP_AGE_PUBLIC_KEY is not set."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "${BACKUP_AGE_PUBLIC_KEY}" in
            age1*) ;;
            *)
              echo "::error::BACKUP_AGE_PUBLIC_KEY must be an age PUBLIC key (starts with 'age1'). Never store the private key (AGE-SECRET-KEY-...) in repo secrets."
              exit 1
              ;;
          esac

      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age
          age --version

      # `supabase db dump` is schema-only by default and has no "include data"
      # flag — `--data-only` is a separate mode. So a full backup is TWO passes
      # concatenated: schema (DDL) first, then data (INSERTs, with triggers
      # disabled via session_replication_role). Restoring the combined file with
      # psql replays them in that order, which is what a fresh project needs.
      #
      # The data pass skips tables whose rows are re-crawled or derived, never
      # anything a user, an order or the money ledger wrote. `--exclude` acts on
      # the data-only pass only (`supabase db dump --help`, CLI 2.109); each
      # table gets its own flag (a comma list would keep a leading space).
      - name: Dump the database (schema + data, public and auth)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          exclude=(
            public.sab_market_raw_listings       # SAB crawl rows; re-crawled daily, >30 d rolled into sab_raw_listing_daily
            public.sab_market_evidence_display   # derived from the raw rows by sab_refresh_evidence_display (~220 MB at plateau)
            public.values_raw_listings           # generic values-pipeline crawl rows
            public.adopt_me_market_raw_listings  # Adopt Me crawl rows
            public.value_funnel_events           # analytics clicks, not business records
            public.rate_limits                   # short-lived rate-limit counters
          )
          args=()
          for t in "${exclude[@]}"; do args+=(--exclude "$t"); done
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql --schema public,auth
          test -s schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f data.sql --schema public,auth --data-only "${args[@]}"
          test -s data.sql
          cat schema.sql data.sql > dump.sql
          rm -f schema.sql data.sql
          test -s dump.sql
          echo "Dump size: $(du -h dump.sql | cut -f1)"

      - name: Compress and encrypt the dump
        env:
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          gzip -9 dump.sql
          test -s dump.sql.gz
          age --encrypt --recipient "$BACKUP_AGE_PUBLIC_KEY" \
            --output "dump-${stamp}.sql.gz.age" dump.sql.gz
          test -s "dump-${stamp}.sql.gz.age"
          # Remove the plaintext so a later step cannot accidentally upload it.
          rm -f dump.sql.gz
          echo "Encrypted size: $(du -h "dump-${stamp}.sql.gz.age" | cut -f1)"

      - name: Upload the encrypted backup artifact
        uses: actions/upload-artifact@v5
        with:
          name: db-backup-${{ env.STAMP }}
          path: dump-${{ env.STAMP }}.sql.gz.age
          retention-days: 30
          if-no-files-found: error

      # DLT-004: a scheduled workflow surfaces in no PR check, and GitHub
      # notifies only the last committer. With retention-days: 30, a silent
      # failure that persists ~30 days leaves ZERO recoverable backups. This
      # step is the alarm. It runs on failure OR cancellation (a 60-minute
      # timeout kill is a cancellation, not a failure) and never fails the job
      # itself -- an alert that breaks the run would hide the original error.
      - name: Alert on backup failure
        if: ${{ failure() || cancelled() }}
        env:
          DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          set -uo pipefail
          if [ -z "${DISCORD_OPS_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_OPS_WEBHOOK_URL is not set — the weekly backup failed and nobody was paged."
            exit 0
          fi
          # jq -Rs builds a correctly escaped JSON string, so no shell value is
          # ever interpolated into the payload unquoted.
          payload="$(jq -nc \
            --arg content "🔴 **Weekly DB backup ${OUTCOME}** — no new backup was stored. Backups expire after 30 days (~4 weekly copies), so repeated failures end with nothing to restore from. Run: ${RUN_URL}" \
            '{content: $content, allowed_mentions: {parse: []}}')"
          code="$(curl -sS -o /tmp/alert.out -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            --data "$payload" "$DISCORD_OPS_WEBHOOK_URL" || echo 000)"
          if [ "$code" != "204" ] && [ "$code" != "200" ]; then
            echo "::warning::Discord alert POST returned HTTP $code"
          fi
          exit 0
