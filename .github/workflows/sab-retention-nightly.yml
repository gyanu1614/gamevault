name: SAB Raw Listing Retention (nightly)

# sab_market_raw_listings grew from ~90k to ~137k rows in five days, and that
# growth is what pushed the repricing read past the Vercel function budget on
# 2026-09-14 — prices then froze for five days behind a green workflow.
#
# Repricing has since moved to the runner and reads only active+matched rows,
# but the table still grows without bound and every scan over it pays for that.
# So raw detail older than 30 days is rolled into a per-day summary
# (sab_raw_listing_daily) and the rows are pruned.
#
# Runs at 10:40 UTC (2026-10-09; was 04:40). GitHub starts this repo's
# schedules 5–7 h late by about the same amount for every workflow on a day,
# and at 04:40 this landed beside the backup, the trend-radar rollup and the
# pricing tail — the pile-up that swapped the free-plan database. 10:40 is
# ≥3 h after values pricing (02:10 + up to 5 h) can end, so it never prunes
# while a crawl writes the same rows. Pinned by
# src/test/routes/db-heavy-schedule.test.ts.

on:
  schedule:
    - cron: "40 10 * * *"
  workflow_dispatch:
    inputs:
      retain_days:
        description: Keep raw listings newer than this many days
        required: false
        default: "30"
      dry_run:
        description: Only report what would be pruned (true/false)
        required: false
        default: "false"

concurrency:
  group: sab-retention-nightly
  cancel-in-progress: false

jobs:
  roll-up:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deliberately NOT continue-on-error: retention silently not running is
      # how the table grew into an outage in the first place.
      - name: Roll up and prune old raw listings
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          pnpm retention:sab
          --retain-days ${{ inputs.retain_days || '30' }}
          ${{ (inputs.dry_run == 'true') && '--dry-run' || '' }}
